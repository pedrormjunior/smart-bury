name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Emacs ${{ matrix.emacs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['27.1', '28.2', '29.4', '30.1']
        include:
          - emacs: snapshot
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - name: Byte-compile
        run: make compile
      - name: checkdoc
        run: make checkdoc
      - name: package-lint
        run: make package-lint
